[project]
name = "callbench"
version = "0.1.0"
description = "Regression test bench for Pipecat voice agents: synthetic callers, Postgres job queue, deterministic asserts + LLM judge."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "pgserver>=0.1.4",
    "pipecat-ai[cli,deepgram,groq,runner,silero,webrtc,websocket]>=1.15.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.6",
]

# Proyecto instalable: así "import agent" y "import app" funcionan desde cualquier sitio
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "app"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
