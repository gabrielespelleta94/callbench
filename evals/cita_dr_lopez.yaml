# Simulation: a patient books with Dr. Lopez some day this week (dates are relative to the agenda reset)
name: cita_dr_lopez
judge: !include juez_groq.yaml

scenarios:
  - name: reserva_real
    simulator: !include persona_groq.yaml
    persona: |
      Maria Garcia, a polite patient calling a clinic. Speaks one short sentence at a time. She answers briefly and
      gives her full name (Maria Garcia) when asked.
    goal: "Book an appointment with Doctor Lopez sometime this week (any day is fine). Do not name a date yourself. Accept the first time offered and confirm clearly (say yes) when the receptionist repeats the details, then say goodbye."
    success: "the bot confirmed a booking for Maria Garcia with Dr. Lopez, for a day and time that consultar_huecos returned, after calling reservar_cita, without inventing doctors or times"
    metrics:
      - name: reserva
        measure: function_calls
        calls: [consultar_huecos, reservar_cita]
    max_turns: 8
