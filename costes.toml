# List prices used by tools/coste.py to put a cost on each call.
#
# Cost per call = what the call measured (agent/metricas.py) x list price, even when the
# free tier was used: reports say so. Every price carries the page it was copied from and
# the date it was read. A price that could not be checked has `pendiente = true` and no
# value, and tools/coste.py refuses to give a cost that depends on it.
#
# Keys: [llm.<provider>."<model>"], [stt.<provider>."<model>"], [tts.<provider>."<model or voice>"]
# (the same provider/model pairs the metrics files record in their call_start line).

moneda = "USD"

[llm.groq."openai/gpt-oss-120b"]
input_per_million = 0.15
cached_input_per_million = 0.075
output_per_million = 0.60
fuente = "https://console.groq.com/docs/model/openai/gpt-oss-120b"
fecha = 2026-11-20
nota = "groq.com/pricing shows no per-model prices; same input/output figures in https://console.groq.com/docs/models"

[stt.deepgram."nova-3-general"]
per_minute = 0.0048
fuente = "https://deepgram.com/pricing"
fecha = 2026-11-20
nota = "Pay as you go, Streaming, Nova-3 Monolingual. Promo price (was 0.0077/min). Billed per second."

[tts.deepgram."aura-2-thalia-en"]
per_thousand_characters = 0.030
fuente = "https://deepgram.com/pricing"
fecha = 2026-11-20
nota = "Pay as you go, Aura-2. Billed per 1,000 characters of input text."

# Phase D (ElevenLabs): add [stt.elevenlabs."..."] and [tts.elevenlabs."..."] from
# https://elevenlabs.io/pricing with its date, or `pendiente = true` until checked.
