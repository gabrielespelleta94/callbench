name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      repeticiones:
        description: "Attempts per scenario (2 is the minimum the gate can flag: one lost call is never a regression)"
        default: "2"
      base:
        description: "Committed baseline summary to compare against"
        default: evals/baselines/base.json

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Postgres as an Actions service instead of pgserver: app/db/config.py and
    # tests/conftest.py use DATABASE_URL when it is set. The tests create their own
    # callbench_test database on this server and migrate it with Alembic.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: callbench
          POSTGRES_PASSWORD: callbench
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U callbench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://callbench:callbench@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Tests
        run: uv run pytest -q

  # Evals against the real bot + the regression gate. Manual only (workflow_dispatch):
  # they spend Groq quota. Needs the GROQ_API_KEY and DEEPGRAM_API_KEY repository secrets.
  # The base is a committed summary (evals/baselines/*.json, written with
  # `tools/comparar.py --resumen <round>`), because rounds are not in git.
  evals:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: callbench
          POSTGRES_PASSWORD: callbench
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U callbench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://callbench:callbench@localhost:5432/postgres
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      RONDA: ci-${{ github.run_id }}
      # Metrics inside the round directory, so the gate finds them next to results.jsonl
      CALLBENCH_METRICS_DIR: ${{ github.workspace }}/evals/runs/ci-${{ github.run_id }}/metrics
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Database and agenda relative to this week
        run: |
          uv run alembic upgrade head
          uv run python -m app.db.reiniciar
      - name: API and bot in the background
        run: |
          uv run uvicorn app.main:app --port 8000 > api.log 2>&1 &
          uv run agent/bot.py > bot.log 2>&1 &
          for i in $(seq 60); do
            curl -sf http://127.0.0.1:8000/salud > /dev/null && curl -s -o /dev/null http://localhost:7860 && break
            sleep 2
          done
      - name: Short suite (N kept low for the Groq quota)
        run: uv run python evals/lanzar.py suite evals/suite.yaml -r "${{ inputs.repeticiones }}" -n "$RONDA"
      - name: Report (judge + asserts)
        run: uv run python evals/informe.py "$RONDA" || true
      - name: Regression gate
        run: uv run python tools/comparar.py "${{ inputs.base }}" "$RONDA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-run
          path: |
            evals/runs/
            api.log
            bot.log
