name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Postgres as an Actions service instead of pgserver: app/db/config.py and
    # tests/conftest.py use DATABASE_URL when it is set. The tests create their own
    # callbench_test database on this server and migrate it with Alembic.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: callbench
          POSTGRES_PASSWORD: callbench
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U callbench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://callbench:callbench@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Tests
        run: uv run pytest -q

  # Evals against the real bot (Groq + Deepgram). Manual only: they spend API quota.
